<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق التحكم عن بعد</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; max-width: 400px; width: 100%; padding: 32px 24px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .icon { width: 70px; height: 70px; background: #0284c7; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px; }
        h1 { font-size: 22px; margin-bottom: 12px; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        .btn { display: block; width: 100%; background: #0284c7; color: white; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .btn:hover { background: #0369a1; }
        .footer { margin-top: 16px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📱</div>
        <h1>تطبيق التحكم عن بعد</h1>
        <p>قم بتحميل وتثبيت التطبيق على جهازك لبدء جلسة التحكم وإدارة الهاتف عن بعد بسهولة.</p>
        <a href="remote-control.apk" class="btn" download>تحميل التطبيق (APK)</a>
        <div class="footer">الإصدار 1.0.0 | يتطلب Android 7.0 أو أحدث</div>
    </div>
</body>
</html>
